<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{width:1280px;height:720px}
body::before,body::after{width:1280px;height:720px}
.stage{padding:70px 84px;justify-content:center}
h1{font-size:126px;line-height:.94;letter-spacing:-.05em;max-width:1120px}
h1 .fire{color:var(--fire)}
.top{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.wm{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.035em;color:var(--text)}
.wm .d{color:var(--fire)}
.pill{font-family:var(--mono);font-size:16px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:11px 20px;
  display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.02)}
.live{width:9px;height:9px;border-radius:50%;background:var(--fire);box-shadow:0 0 0 5px rgba(226,102,26,.18)}
.sub{margin-top:36px;font-family:var(--body);font-size:31px;color:var(--dim);font-weight:300}
/* Pledge dots: three filled, threshold marker, the rest hollow. */
.dots{position:absolute;right:84px;bottom:74px;display:flex;gap:15px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--fire);border-color:var(--fire);box-shadow:0 0 22px rgba(226,102,26,.5)}
</style>
<div class="stage">
  <div class="top">
    <span class="wm">Quorum<span class="d">.</span></span>
    <span class="pill"><span class="live"></span>Live on Starknet mainnet</span>
  </div>
  <h1>Go first<br><span class="fire">without being seen.</span></h1>
  <div class="sub">Threshold escrow inside a privacy pool.</div>
  <div class="dots">
    <span class="dot on"></span><span class="dot on"></span><span class="dot on"></span>
    <span class="dot"></span><span class="dot"></span>
  </div>
</div>
