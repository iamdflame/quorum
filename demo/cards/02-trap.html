.cols{display:grid;grid-template-columns:1fr 1fr;gap:110px;margin-top:88px}

<div class="stage">
  <div class="eyebrow">Why on-chain escrow makes it worse</div>
  <h1 style="margin-top:48px">A pledge everyone<br>can see is a pledge<br>that <em>never lands.</em></h1>
  <div class="cols">
    <div class="col"><div class="k">It tells your counterparty</div>
      <p>exactly how much pressure they are under, before the price is set.</p></div>
    <div class="col"><div class="k">It tells everyone else</div>
      <p>whether it is safe to join yet. A visibly half-empty round stays empty.</p></div>
  </div>
</div>
